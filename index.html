<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kikérdező – Tanácsadó szakpszichológus</title>
<meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161a1c" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f5f1ea; --card:#fffdf9; --ink:#1d2528; --muted:#5d686c; --line:#e3ddd2; --soft:#efe9df;
  --acc:#1f6b66; --acc-ink:#fff; --acc-soft:#dcebe8;
  --good:#2d7a46; --good-soft:#e1f0e5; --bad:#b4442f; --bad-soft:#f7e3dd; --warn:#a86d12;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161a1c; --card:#1f2427; --ink:#e9ecea; --muted:#9aa5a8; --line:#323a3e; --soft:#262c2f;
  --acc:#5fb3aa; --acc-ink:#0f1a19; --acc-soft:#203634;
  --good:#6cc28a; --good-soft:#1d3326; --bad:#ef8a73; --bad-soft:#3a231e; --warn:#e2ad55;
  color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);
  padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.wrap{max-width:680px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}

/* fejléc */
header.top{padding:22px 2px 10px}
.eyebrow{font:600 .74rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
h1{font:700 2rem/1.1 var(--serif);margin:8px 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0;font-size:.95rem}
.summary{display:flex;gap:8px;margin:16px 0 6px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--muted)}
.pill b{color:var(--ink);font-variant-numeric:tabular-nums}

/* beállítások */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:14px 0}
.panel h2{font:600 .78rem/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row + .row{margin-top:12px}
.lbl{font-size:.9rem;font-weight:600}
.lbl small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}

/* tananyag-kártyák */
.sets-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 8px}
.sets-head h2{font:600 1.15rem/1.2 var(--serif);margin:0}
.linkbtn{border:0;background:none;color:var(--acc);font-weight:600;font-size:.88rem;cursor:pointer;padding:6px}
.group-title{font:600 .74rem/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
.set{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.set.on{border-color:var(--acc)}
.set-main{display:flex;gap:12px;align-items:flex-start;padding:14px;cursor:pointer}
.chk{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;margin-top:2px;background:var(--card)}
.chk svg{width:14px;height:14px;opacity:0}
.on > .set-main .chk, .chk.on{background:var(--acc);border-color:var(--acc)}
.on > .set-main .chk svg, .chk.on svg{opacity:1}
.chk.part{background:var(--acc-soft);border-color:var(--acc)}
.chk.part::after{content:"";width:10px;height:2px;background:var(--acc);border-radius:2px}
.set-txt{flex:1;min-width:0}
.set-title{font:600 1.05rem/1.25 var(--serif);margin:0}
.set-file{display:block;margin-top:2px;font:400 .78rem/1.3 var(--sans);color:var(--muted);word-break:break-word}
.set-meta{color:var(--muted);font-size:.82rem;margin-top:3px}
.badge{display:inline-block;font:700 .66rem/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;background:var(--acc);color:var(--acc-ink);padding:4px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
.mastery{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:var(--soft);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)} .bar .b{background:var(--bad);opacity:.75}
.expand{flex:none;border:0;background:var(--soft);width:34px;height:34px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.expand svg{transition:transform .2s}
.set.open .expand svg{transform:rotate(180deg)}
.topics{display:none;border-top:1px solid var(--line);padding:6px 8px 10px}
.set.open .topics{display:block}
.topic{display:flex;gap:10px;align-items:center;padding:9px 6px;border-radius:10px;cursor:pointer}
.topic:hover{background:var(--soft)}
.topic .chk{width:20px;height:20px;border-radius:6px;margin:0}
.topic .chk svg{width:12px;height:12px}
.topic span{flex:1;font-size:.92rem}
.topic em{font-style:normal;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}

/* indító sáv */
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock .wrap{display:flex;gap:10px}
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:700;font-size:1rem;cursor:pointer;background:var(--acc);color:var(--acc-ink);flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.small{flex:none;padding:12px 14px;font-size:.92rem}

/* kvíz */
.qbar{display:flex;align-items:center;gap:12px;padding:16px 2px 8px}
.close{border:0;background:var(--card);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;cursor:pointer;display:grid;place-items:center;flex:none}
.prog{flex:1}
.prog .bar{height:8px}
.prog .bar i{background:var(--acc);transition:width .3s}
.prog-txt{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px;margin-top:10px}
.qsrc{font-size:.78rem;color:var(--acc);font-weight:600;margin-bottom:10px}
.qsrc .set-file{display:inline;margin:0}
.qtext{font:600 1.28rem/1.38 var(--serif);margin:0 0 18px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 14px;cursor:pointer;font-size:.98rem;line-height:1.4;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font:700 .82rem var(--sans);color:var(--muted)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;border-radius:14px;padding:14px;font-size:.94rem}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb strong{display:block;font-size:1rem;margin-bottom:2px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}
.kbd{color:var(--muted);font-size:.78rem;text-align:center;margin-top:12px}
@media (hover:none){.kbd{display:none}}

/* eredmény */
.result{text-align:center;padding:30px 4px 8px}
.score{font:700 4rem/1 var(--serif);font-variant-numeric:tabular-nums;margin:6px 0}
.verdict{font:600 1.15rem/1.3 var(--serif);margin:4px 0 4px}
.sub{color:var(--muted);font-size:.92rem}
.miss-h{font:600 1.05rem/1.2 var(--serif);margin:26px 2px 10px}
.miss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.miss li{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:12px 14px;font-size:.93rem}
.miss .mq{font-weight:600;margin-bottom:6px}
.miss .ma{color:var(--good);font-weight:600}
.miss .mw{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.miss .me{color:var(--muted);font-size:.86rem;margin-top:4px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
footer{color:var(--muted);font-size:.78rem;text-align:center;margin:30px 0 10px}
footer button{font-size:.78rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ===================== KEZDŐKÉPERNYŐ ===================== -->
<main id="home" class="wrap">
  <header class="top">
    <div class="eyebrow">ELTE PPK · Tanácsadó szakpszichológus</div>
    <h1>Kikérdező</h1>
    <p class="lead">Jelöld be, mit szeretnél gyakorolni, aztán indulhat a kérdezés.</p>
    <div class="summary" id="summary"></div>
  </header>

  <section class="panel" aria-label="Beállítások">
    <div class="row">
      <div class="lbl">Kérdések száma</div>
      <div class="seg" id="segCount" role="group" aria-label="Kérdések száma">
        <button data-v="10">10</button><button data-v="20">20</button><button data-v="40">40</button><button data-v="0">Mind</button>
      </div>
    </div>
    <div class="row">
      <div class="lbl">Mit kérdezzen?<small id="modeHint"></small></div>
      <div class="seg" id="segMode" role="group" aria-label="Kérdezési mód">
        <button data-v="mix">Vegyesen</button><button data-v="weak">Gyengébbek előre</button><button data-v="wrong">Csak hibásak</button>
      </div>
    </div>
  </section>

  <div class="sets-head">
    <h2>Tananyagok</h2>
    <button class="linkbtn" id="toggleAll">Mind kijelöl</button>
  </div>
  <div id="sets"></div>

  <footer>
    <div id="footInfo"></div>
    <button class="linkbtn" id="resetStats">Statisztika törlése</button>
  </footer>
</main>

<div class="dock" id="dock"><div class="wrap">
  <button class="btn" id="start" disabled>Indítás</button>
</div></div>

<!-- ===================== KVÍZ ===================== -->
<main id="quiz" class="wrap hidden" aria-live="polite">
  <div class="qbar">
    <button class="close" id="quit" aria-label="Kilépés a menübe">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
    </button>
    <div class="prog">
      <div class="bar"><i id="progFill" style="width:0"></i></div>
      <div class="prog-txt"><span id="progTxt"></span><span id="scoreTxt"></span></div>
    </div>
  </div>
  <div class="qcard">
    <div class="qsrc" id="qsrc"></div>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>
    <div id="fb"></div>
  </div>
  <div class="kbd">Billentyűk: 1–4 a válaszhoz, Enter a továbblépéshez</div>
</main>

<div class="dock hidden" id="qdock"><div class="wrap">
  <button class="btn" id="next">Következő</button>
</div></div>

<!-- ===================== EREDMÉNY ===================== -->
<main id="result" class="wrap hidden"></main>

<script>
/* =========================================================
   TANANYAGOK – minden új anyag egy TANANYAG({...}) blokk.
   Formátum:
   TANANYAG({ id, cim, targy, forras, fajl:"forrásfájl neve", felveve:"ÉÉÉÉ-HH-NN",
     temak:[ { cim, kerdesek:[ {q:"kérdés", o:["HELYES","rossz","rossz","rossz"], e:"magyarázat"} ] } ] })
   Az o[0] mindig a helyes válasz – a program keveri.
   ========================================================= */
const SETS = [];
function TANANYAG(s){ SETS.push(s); }
/* ---- 01-definicio.js ---- */
TANANYAG({
  id: "pt01-definicio",
  cim: "01 · Meghatározás, keretek",
  targy: "Pszichológiai tanácsadás – elméleti összefoglaló",
  forras: "Kissné Viszket Mónika, ELTE PPK (diasor)",
  fajl: "Pszichológiai Tanácsadás 01 definíció, keret.pptx",
  felveve: "2026-11-22",
  temak: [
    {
      cim: "Definíciók",
      kerdesek: [
        {q: "Ritoók Magda szerint a pszichológiai tanácsadás melyik tevékenységrendszerbe tartozik?",
         o: ["A professzionális segítő kapcsolati tevékenységek rendszerébe", "Az egészségügyi gyógyító tevékenységek rendszerébe", "A pszichoterápiás eljárások rendszerébe", "A pedagógiai szakszolgálati tevékenységek rendszerébe"],
         e: "Ritoók (2003): a segítő kapcsolati tevékenységek a legszélesebb értelemben vett egészséges társadalmi alkalmazkodást szolgálják, ezek egyike a tanácsadás."},
        {q: "Melyik jellemzés illik Ritoók tanácsadás-definíciójára?",
         o: ["Viszonylag rövid távú, interperszonális, elméleti alapú, etikai és jogi normák által irányított", "Hosszú távú, feltáró, a tudattalan konfliktusokra irányuló", "Rövid, információközlő, szakmai normáktól független", "Medikális modellre épülő, diagnózisközpontú"],
         e: "„A tanácsadás: viszonylag rövid távú, interperszonális, elméleti alapú, etikai és jogi normák által irányított szakmai tevékenység…”"},
        {q: "Ritoók definíciója szerint mi a tanácsadás fő célja?",
         o: ["Pszichológiailag alapvetően egészséges személyeknek segíteni fejlődési és szituációs problémáik megoldásában", "Pszichiátriai zavarok tüneteinek megszüntetése", "A személyiség teljes átstrukturálása", "Kizárólag pályaválasztási információ nyújtása"],
         e: "A célcsoport a pszichológiailag alapvetően egészséges személy, a fókusz a fejlődési és szituációs problémák."},
        {q: "Buda Béla (2009) szerint mi indokolhatja tanácsadás alkalmazását olyan problémáknál, amelyek akár pszichoterápiát is indikálhatnának?",
         o: ["Az időtényező és/vagy a beavatkozás sürgőssége", "A kliens anyagi helyzete", "A pszichoterapeuták hiánya", "A diagnózis bizonytalansága"],
         e: "Buda B.: a tanácsadás korlátozott célokat követ; alkalmazását indokolhatja az időtényező és/vagy a beavatkozás sürgőssége."},
        {q: "Az Európai Tanácsadási Társaság (EAC, 2002) definíciója szerint mi a tanácsadás?",
         o: ["Interaktív tanulási folyamat szerződő felek között, holisztikus (biopszichoszociális) megközelítéssel", "Egyirányú tanácsadás a szakértő részéről", "Rövid krízisintervenció kizárólag egyéneknek", "Orvosi felügyelet alatt végzett terápiás eljárás"],
         e: "EAC: interaktív tanulási folyamat a szerződő tanácsadó(k) és kliens(ek) – egyének, családok, csoportok, intézmények – között, holisztikus megközelítéssel."},
        {q: "Kinek a meghatározása: „A tanácsadási munka segít az önállóvá válásban a döntések, érzelmi problémák, konfliktusmegoldások és a munkába bevitt lelki helyzetek kezelésében”?",
         o: ["Bagdy Emőke (2009)", "Buda Béla (2009)", "Ritoók Magda (2003)", "Wiegersma (1976)"],
         e: "Ez Bagdy E. (2009) megfogalmazása."},
        {q: "A EuroPsy (2013) tanácsadás-definíciója szerint hogyan helyezi el a tanácsadás a jelentkezőt?",
         o: ["Nem az egészség–betegség dimenzióban", "A betegség-dimenzió enyhe pólusán", "Pszichopatológiai kategóriák szerint", "Kizárólag életkori szakasz szerint"],
         e: "A definíció szerint a tanácsadás döntési, problémamegoldó képességet fejleszt, aktív részvételt vár el, és nem az egészség–betegség dimenzióban helyezi el a jelentkezőt."},
        {q: "Mit vár el a klienstől a tanácsadás a EuroPsy-definíció szerint?",
         o: ["Aktív részvételt", "Passzív befogadást", "Orvosi beutalót", "Előzetes diagnózist"],
         e: "A tanácsadás lehetővé teszi, illetve elvárja az aktív részvételt."}
      ]
    },
    {
      cim: "Wiegersma szintjei",
      kerdesek: [
        {q: "Kinek az elméleti koncepciója írja le a tanácsadás az információadástól a pszichoterápiáig mélyülő tevékenységrendszerét?",
         o: ["Wiegersma S. (1976)", "Carl Rogers (1951)", "Egan (2016)", "Argelander (2006)"],
         e: "A tanácsadás formáit és szakmai határait Wiegersma (1976) koncepciója alapján fogalmazzák meg."},
        {q: "Hány szintet különít el a Wiegersma-féle modell?",
         o: ["Ötöt", "Hármat", "Négyet", "Hatot"],
         e: "1. információs tanácsadás, 2. konzultáció, 3. tanácsadás, 4. fokális tanácsadás, 5. pszichoterápia."},
        {q: "Melyik a Wiegersma-modell 2. szintje?",
         o: ["Konzultáció", "Információs tanácsadás", "Fokális tanácsadás", "Pszichoterápia"],
         e: "A 2. szint a konzultáció: személyre szabott információadás, a döntés és értékelés szempontjainak kidolgozása."},
        {q: "Melyik a Wiegersma-modell 4. szintje?",
         o: ["Fokális tanácsadás", "Konzultáció", "Tanácsadás", "Információs tanácsadás"],
         e: "4. szint: fokális tanácsadás – a probléma fókuszba helyezése, komoly önismereti munka kell."},
        {q: "„A döntéshozási helyzet nem világos, de reálisak a választási lehetőségek, és a személy kis segítséggel képes önállóan dönteni.” Melyik szint?",
         o: ["1. szint – információs tanácsadás", "2. szint – konzultáció", "3. szint – tanácsadás", "4. szint – fokális tanácsadás"],
         e: "Mindennapi problémák; általános, többrétű információnyújtás a lehetőségekről és következményeikről."},
        {q: "„Sok információ hiányzik, több ellentétes szempontot kell figyelembe venni, a személy bizonytalan.” Melyik szint?",
         o: ["2. szint – konzultáció", "1. szint – információs tanácsadás", "3. szint – tanácsadás", "5. szint – pszichoterápia"],
         e: "Konzultáció: személyre szabott információadás, a döntés és értékelés főbb szempontjait ki kell dolgozni."},
        {q: "„Komoly belső konfliktusok, bizonytalan jövőkép, irreális, inkonzisztens vágyak, problémás motivációk.” Melyik szint?",

         o: ["A szakember személye – „aki végzi a tevékenységet” –, nem maga a tevékenység", "Maga a végzett tevékenység", "A kliens diagnózisa", "Az intézmény gazdálkodása"],
         e: "Módszertanilag közel áll a pszichoterápiához; rendszeres találkozást igényel."},
        {q: "Mi a tanácsadói esetmegbeszélés célja?",
         o: ["A szakmai kompetencia növelése, a szakmai szerep elsajátítása és finomhangolása, a kooperáció és hatékonyság fejlesztése", "A tanácsadó magánéleti problémáinak terápiája", "A kliens diagnózisának felállítása", "Az intézményi ellenőrzés"],
         e: "Nem feltétele a folyamatszerűség, lehet epizodikus."},
        {q: "Milyen gyakran javasolt az esetmegbeszélő alkalmak megtartása?",
         o: ["Legalább kéthetente; havonta egyszer esetén legalább 2×2 órás ülésben", "Évente egyszer", "Csak krízis esetén", "Naponta"],
         e: "Projektkísérés vagy krízis esetén gyakoribb is lehet."},
        {q: "Mi a projektkísérés?",
         o: ["Időben behatárolt, konkrét feladatra szerveződött, intézményen belüli team/csoport szupervíziója", "Egyéni, diádikus esetmegbeszélés", "Vezető nélküli peer group", "Online továbbképzés"],
         e: "A team-esetmegbeszélés egyik formája; cél a teammunka optimalizálása."},
        {q: "Mi jellemzi a peer group-esetmegbeszélőt?",
         o: ["Explicit vezetés nélküli, a csoport a korábban elsajátított módszerekkel önállóan dolgozik", "Mindig külső szupervizor vezeti", "Egy fő vesz részt rajta", "Hierarchikus, értékelő folyamat"],
         e: "A tanácsadói esetmegbeszélő csoport kiteljesedése."},
        {q: "Hány fős peer group javasolt (Tietze, 2002)?",
         o: ["6–9 fő", "2–3 fő", "12–15 fő", "20 fő felett"],
         e: ""},
        {q: "Melyik a peer group-szupervízió hat fázisa helyes sorrendben?",
         o: ["Szerepkijelölés → esetbemutatás → kulcskérdés → módszerválasztás → konzultáció → konklúzió", "Esetbemutatás → szerepkijelölés → konzultáció → kulcskérdés → módszerválasztás → konklúzió", "Kulcskérdés → esetbemutatás → konzultáció → szerepkijelölés → konklúzió → módszerválasztás", "Módszerválasztás → szerepkijelölés → esetbemutatás → kulcskérdés → konklúzió → konzultáció"],
         e: "Tietze (2002)."},
        {q: "Melyik szerepet jelölik ki elsőként a peer group szerepkijelölési fázisában?",
         o: ["A moderátort, aki mindvégig segíti a folyamatot", "Az esethozót", "A titkárt", "A konzultánsokat"],
         e: "Három fő szerep: esetbemutató, moderátor, tanácsadók (konzultánsok); egyikük titkárként jegyzetel."},
        {q: "Mit tesz az esetbemutató a konzultáció fázisában?",
         o: ["Figyelmesen hallgat, míg a tanácsadók a választott modul szerint megosztják ötleteiket", "Folyamatosan vitatkozik a javaslatokkal", "Moderálja a beszélgetést", "Elhagyja a termet"],
         e: "A jegyző rögzíti a legfontosabb üzeneteket."},
        {q: "Melyik a megbízható peer group-légkör négy összetevője?",
         o: ["Felelősség, bizalom, támogatás, értékelés", "Empátia, elfogadás, hitelesség, jelenlét", "Gyorsaság, pontosság, hatékonyság, kontroll", "Biztonság, választás, együttműködés, tisztelet"],
         e: "Nagyobb belső konfliktus esetén külső szakember segítsége kell."},
        {q: "Mikor rendezik meg a Pszichológiai Tanácsadás Konferenciát?",
         o: ["Minden év novemberében (MPT és ELTE PPK Pszichológiai Intézet közös szervezésében)", "Minden év márciusában", "Kétévente szeptemberben", "Minden nyáron"],
         e: ""},
        {q: "Mi adja a jogosultságot egy módszer használatára, és mit engedélyeznek az egyesületek?",
         o: ["Az alapképesítés adja a jogosultságot; az egyesületek a módszerspecifikus cím használatát engedélyezik", "Az egyesület adja a jogosultságot a pszichoterápiára", "Az OKFŐ minden módszert külön engedélyez", "A kliens hozzájárulása adja a jogosultságot"],
         e: ""},
        {q: "Ki hozza a végső döntést arról, hogy egy módszer a pszichoterapeuta képzésben elfogadottá válik-e?",
         o: ["Az OKFŐ (Országos Kórházi Főigazgatóság)", "A Pszichoterápiás Tanács Szövetség", "Az MPT", "Az ELTE PPK"],
         e: "Az orvosegyetemek pszichoterápiás grémiumai ajánlanak, a kari tanácsok döntenek; a Pszichoterápiás Tanács Szövetségnek nincs döntési szerepe."},
        {q: "Milyen mérőeszközzel mérte az ELTE Életvezetési Tanácsadás a hallgatói tanácsadás hatékonyságát?",
         o: ["OQ-39 (az Outcome Questionnaire-45.2 magyar, 39 tételes változata)", "BDI-II", "MBI", "CORE-OM"],
         e: "215 résztvevő, átlagosan 6 alkalom; szignifikáns javulás, a legnagyobb a súlyosabb állapotban bejelentkezőknél."},
        {q: "Kik érték el a legnagyobb fejlődést az ELTE OQ-39-es vizsgálatában?",
         o: ["A súlyosabb állapotban bejelentkezők", "Az enyhe tünetekkel érkezők", "A nemzetközi hallgatók", "Az elsőévesek"],
         e: "Még rövid, strukturált folyamatok is hatékonyak lehetnek."},
        {q: "Hány tanácskérőt látott el a TÁMOP 2.2.2. keretében felépülő életpálya-tanácsadói hálózat?",
         o: ["26 692 főt", "2 097 főt", "215 főt", "100 000 főt"],
         e: "Személyes tanácsadásnál a lehetséges pontszám 98,37%-át adták az ügyfelek."},
        {q: "Mit ajánl az alapprotokoll a hatékonyságmérés egységesítésére?",
         o: ["Egységes tesztbattéria kiépítését, amelyhez területspecifikus kérdések illeszthetők", "Minden intézmény saját kérdőívét", "A mérés megszüntetését", "Csak kvalitatív interjúkat"],
         e: "Példa lehet az OQ-45.2 magyar változata."},
        {q: "Hány tanulmányt tekint át Larson és Daniels 1998-as összegző tanulmánya a tanácsadói énhatékonyságról?",
         o: ["32-t", "37-et", "45-öt", "10-et"],
         e: "A BACP 2013-ban 37 tanulmány alapján támasztotta alá a tanácsadás és pszichoterápia hatékonyságát."},
        {q: "Mit mutatnak a nemzetközi orvosi modellben végzett vizsgálatok a klinikai depresszióról?",
         o: ["A tanácsadás a gyógyszeres kezeléssel összehasonlítva jobb eredményeket mutat, hosszú távon is (relapszus-megelőzés)", "A tanácsadás hatástalan depresszióban", "Csak gyógyszerrel együtt hatásos", "Rövid távon jobb, hosszú távon rosszabb"],
         e: "Chilvers et al., 2001; Rowland et al., 2000; Ward et al., 2000."}
      ]
    }
  ]
});

</script>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const LS = "kikerdezo.v1.";
const store = {
  get(k, d){ try{ const v = localStorage.getItem(LS+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }
};

/* --- kérdés-azonosító: tananyag + a kérdés szövegének hash-e --- */
function hash(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0).toString(36); }

/* --- adatok előkészítése --- */
const ALL = [];   // minden kérdés lapítva
SETS.forEach((s, si) => {
  s.temak.forEach((t, ti) => {
    t.kerdesek.forEach(k => {
      ALL.push({ id: s.id + ":" + hash(k.q), set: s, si, ti, topic: t.cim, q: k.q, o: k.o, e: k.e || "" });
    });
  });
});

let stats = store.get("stats", {});            // {qid:{j,h,u}}  j=jó, h=hibás, u=utolsó (1/0)
let sel = store.get("sel", null);              // {setId:[topicIndex,...]}
let opt = Object.assign({count:20, mode:"mix"}, store.get("opt", {}));
if (!sel){ sel = {}; SETS.forEach(s => sel[s.id] = s.temak.map((_,i)=>i)); }

/* ================= KEZDŐKÉPERNYŐ ================= */
const CHECK = '<svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg>';
const CHEV = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5l4 4 4-4"/></svg>';

function qsOf(setId, ti){ return ALL.filter(x => x.set.id === setId && (ti === undefined || x.ti === ti)); }
function mastery(list){
  let g=0,b=0; list.forEach(x => { const st = stats[x.id]; if (st){ st.u ? g++ : b++; } });
  return {g, b, n:list.length};
}
function isNew(s){ if (!s.felveve) return false; const d = (Date.now() - new Date(s.felveve).getTime())/864e5; return d >= 0 && d < 14; }
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderHome(){
  // összegzés
  const m = mastery(ALL);
  $("#summary").innerHTML =
    `<span class="pill"><b>${SETS.length}</b> tananyag</span>` +
    `<span class="pill"><b>${ALL.length}</b> kérdés</span>` +
    `<span class="pill">tudott: <b>${m.g}</b> / ${ALL.length}</span>`;

  // csoportosítás tárgy szerint, megtartva a felvétel sorrendjét
  const groups = [];
  SETS.forEach(s => { let g = groups.find(x => x.t === (s.targy||"Egyéb")); if (!g){ g = {t:s.targy||"Egyéb", s:[]}; groups.push(g); } g.s.push(s); });

  const box = $("#sets"); box.innerHTML = "";
  groups.forEach(g => {
    const h = document.createElement("div"); h.className = "group-title"; h.textContent = g.t; box.appendChild(h);
    g.s.forEach(s => {
      const chosen = sel[s.id] || [];
      const full = chosen.length === s.temak.length, part = chosen.length > 0 && !full;
      const list = qsOf(s.id), mm = mastery(list);
      const el = document.createElement("div");
      el.className = "set" + (full ? " on" : "") + (openSets.has(s.id) ? " open" : "");
      el.innerHTML = `
        <div class="set-main" role="checkbox" tabindex="0" aria-checked="${full?"true":part?"mixed":"false"}">
          <div class="chk${part?" part":""}">${part?"":CHECK}</div>
          <div class="set-txt">
            <p class="set-title">${esc(s.cim)}${isNew(s)?'<span class="badge">új</span>':""}${s.fajl?` <span class="set-file">(${esc(s.fajl)})</span>`:""}</p>
            <div class="set-meta">${list.length} kérdés · ${s.temak.length} témakör${s.forras?" · "+esc(s.forras):""}</div>
            <div class="mastery"><div class="bar"><i class="g" style="width:${mm.g/mm.n*100}%"></i><i class="b" style="width:${mm.b/mm.n*100}%"></i></div><span>${mm.g}/${mm.n}</span></div>
          </div>
          <button class="expand" aria-label="Témakörök" aria-expanded="${openSets.has(s.id)}">${CHEV}</button>
        </div>
        <div class="topics">${s.temak.map((t,ti) => {
            const on = chosen.includes(ti), tm = mastery(qsOf(s.id, ti));
            return `<div class="topic" role="checkbox" tabindex="0" aria-checked="${on}" data-ti="${ti}"><div class="chk${on?" on":""}">${CHECK}</div><span>${esc(t.cim)}</span><em>${tm.g}/${tm.n}</em></div>`;
          }).join("")}</div>`;
      const main = el.querySelector(".set-main");
      const toggleSet = () => { sel[s.id] = full ? [] : s.temak.map((_,i)=>i); save(); renderHome(); };
      main.addEventListener("click", e => { if (e.target.closest(".expand")) return; toggleSet(); });
      main.addEventListener("keydown", e => { if (e.key===" "||e.key==="Enter"){ e.preventDefault(); toggleSet(); } });
      el.querySelector(".expand").addEventListener("click", e => { e.stopPropagation(); openSets.has(s.id) ? openSets.delete(s.id) : openSets.add(s.id); renderHome(); });
      el.querySelectorAll(".topic").forEach(tp => {
        const ti = +tp.dataset.ti;
        const tog = () => { const a = new Set(sel[s.id]||[]); a.has(ti) ? a.delete(ti) : a.add(ti); sel[s.id] = [...a].sort((x,y)=>x-y); save(); renderHome(); };
        tp.addEventListener("click", tog);
        tp.addEventListener("keydown", e => { if (e.key===" "||e.key==="Enter"){ e.preventDefault(); tog(); } });
      });
      box.appendChild(el);
    });
  });

  // beállítás-gombok
  document.querySelectorAll("#segCount button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === opt.count)));
  document.querySelectorAll("#segMode button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === opt.mode)));
  $("#modeHint").textContent = {mix:"véletlen sorrend", weak:"előbb a rontott és még nem látott kérdések", wrong:"csak amit legutóbb elrontottál"}[opt.mode];

  const anySel = Object.values(sel).some(a => a.length);
  $("#toggleAll").textContent = SETS.every(s => (sel[s.id]||[]).length === s.temak.length) ? "Kijelölés törlése" : "Mind kijelöl";

  const pool = buildPool();
  const n = opt.count ? Math.min(opt.count, pool.length) : pool.length;
  const st = $("#start");
  st.disabled = n === 0;
  st.textContent = !anySel ? "Válassz tananyagot" : n === 0 ? (opt.mode==="wrong" ? "Nincs hibás kérdés a kijelöltekben" : "Nincs kérdés") : `Indítás · ${n} kérdés`;

  const last = SETS.map(s => s.felveve).filter(Boolean).sort().pop();
  $("#footInfo").textContent = last ? `Utoljára bővítve: ${last.replace(/-/g,". ")}.` : "";
}
const openSets = new Set();
function save(){ store.set("sel", sel); store.set("opt", opt); }

document.querySelectorAll("#segCount button").forEach(b => b.addEventListener("click", () => { opt.count = +b.dataset.v; save(); renderHome(); }));
document.querySelectorAll("#segMode button").forEach(b => b.addEventListener("click", () => { opt.mode = b.dataset.v; save(); renderHome(); }));
$("#toggleAll").addEventListener("click", () => {
  const allOn = SETS.every(s => (sel[s.id]||[]).length === s.temak.length);
  SETS.forEach(s => sel[s.id] = allOn ? [] : s.temak.map((_,i)=>i)); save(); renderHome();
});
let resetArmed = null;
$("#resetStats").addEventListener("click", e => {
  const b = e.currentTarget;
  if (!resetArmed){ b.textContent = "Biztosan törlöd? Koppints újra"; resetArmed = setTimeout(() => { resetArmed = null; b.textContent = "Statisztika törlése"; }, 3500); return; }
  clearTimeout(resetArmed); resetArmed = null; b.textContent = "Statisztika törlése";
  stats = {}; store.set("stats", stats); renderHome();
});

/* ================= KÉRDÉSSOR ÖSSZEÁLLÍTÁSA ================= */
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function buildPool(){
  let pool = ALL.filter(x => (sel[x.set.id]||[]).includes(x.ti));
  if (opt.mode === "wrong") pool = pool.filter(x => stats[x.id] && !stats[x.id].u);
  return pool;
}
function weakScore(x){ const st = stats[x.id]; if (!st) return 1; if (!st.u) return 0; return 2 + Math.min(st.j,5) - st.h*0.5; }

/* ================= KVÍZ ================= */
let run = null;
function startRun(list){
  if (!list.length) return;
  run = { list, i:0, good:0, answers:[] };
  show("quiz"); renderQ();
}
$("#start").addEventListener("click", () => {
  let pool = buildPool();
  if (opt.mode === "weak"){
    pool = shuffle(pool).sort((a,b) => weakScore(a) - weakScore(b));
  } else pool = shuffle(pool);
  if (opt.count) pool = pool.slice(0, opt.count);
  if (opt.mode === "weak") pool = shuffle(pool);
  startRun(pool);
});

function renderQ(){
  const x = run.list[run.i];
  run.cur = { x, order: shuffle(x.o.map((t,i)=>({t, ok:i===0}))), done:false };
  $("#progFill").style.width = (run.i / run.list.length * 100) + "%";
  $("#progTxt").textContent = `${run.i+1} / ${run.list.length}`;
  $("#scoreTxt").textContent = run.i ? `${run.good} jó` : "";
  $("#qsrc").innerHTML = esc(x.set.cim + " · " + x.topic) + (x.set.fajl ? ` <span class="set-file">(${esc(x.set.fajl)})</span>` : "");
  $("#qtext").textContent = x.q;
  $("#fb").innerHTML = "";
  const box = $("#opts"); box.innerHTML = "";
  run.cur.order.forEach((o, k) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="k">${"ABCD"[k]||k+1}</span><span>${esc(o.t)}</span>`;
    b.addEventListener("click", () => answer(k));
    box.appendChild(b);
  });
  $("#qdock").classList.add("hidden");
  window.scrollTo({top:0});
}
function answer(k){
  if (run.cur.done) return;
  run.cur.done = true;
  const {x, order} = run.cur, ok = order[k].ok;
  const btns = [...document.querySelectorAll("#opts .opt")];
  btns.forEach((b,i) => { b.disabled = true; if (order[i].ok) b.classList.add("ok"); else if (i===k) b.classList.add("no"); else b.classList.add("dim"); });
  if (ok) run.good++;
  run.answers.push({x, ok, chosen: order[k].t});
  const st = stats[x.id] || {j:0,h:0,u:0};
  ok ? st.j++ : st.h++; st.u = ok ? 1 : 0; stats[x.id] = st; store.set("stats", stats);
  const right = order.find(o=>o.ok).t;
  $("#fb").innerHTML = `<div class="fb ${ok?"ok":"no"}"><strong>${ok ? pick(["Így van!","Pontosan.","Helyes!","Szép!"]) : "Nem egészen."}</strong>${ok ? "" : `A helyes válasz: <b>${esc(right)}</b>. `}${esc(x.e)}</div>`;
  $("#scoreTxt").textContent = `${run.good} jó`;
  $("#next").textContent = run.i+1 < run.list.length ? "Következő" : "Eredmény";
  $("#qdock").classList.remove("hidden");
  $("#next").focus({preventScroll:true});
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
$("#next").addEventListener("click", () => { run.i++; run.i < run.list.length ? renderQ() : renderResult(); });
$("#quit").addEventListener("click", () => {
  run = null; show("home");
});
document.addEventListener("keydown", e => {
  if ($("#quiz").classList.contains("hidden") || !run) return;
  if (/^[1-4]$/.test(e.key) && !run.cur.done){ const k = +e.key-1; if (k < run.cur.order.length) answer(k); }
  else if (e.key === "Enter" && run.cur.done){ e.preventDefault(); $("#next").click(); }
});

/* ================= EREDMÉNY ================= */
function renderResult(){
  const n = run.list.length, g = run.good, p = Math.round(g/n*100);
  const missed = run.answers.filter(a => !a.ok);
  const verdict = p >= 90 ? "Kiváló – ez megy!" : p >= 75 ? "Jó eredmény." : p >= 50 ? "Alakul, érdemes átismételni a hibásakat." : "Ezt még érdemes újra átnézni.";
  $("#result").innerHTML = `
    <div class="result">
      <div class="eyebrow">Eredmény</div>
      <div class="score">${p}%</div>
      <div class="verdict">${verdict}</div>
      <div class="sub">${g} jó válasz ${n} kérdésből</div>
    </div>
    <div class="actions">
      ${missed.length ? `<button class="btn" id="rMiss">A ${missed.length} hibás újra</button>` : ""}
      <button class="btn ${missed.length?"ghost":""}" id="rAgain">Új kör ugyanebből</button>
      <button class="btn ghost" id="rHome">Vissza a tananyagokhoz</button>
    </div>
    ${missed.length ? `<h3 class="miss-h">Amit elrontottál</h3><ul class="miss">${missed.map(a => `
      <li><div class="mq">${esc(a.x.q)}</div>
      <div class="mw">${esc(a.chosen)}</div>
      <div class="ma">${esc(a.x.o[0])}</div>
      ${a.x.e ? `<div class="me">${esc(a.x.e)}</div>` : ""}</li>`).join("")}</ul>` : ""}`;
  show("result");
  const list = run.list;
  if (missed.length) $("#rMiss").onclick = () => startRun(shuffle(missed.map(a => a.x)));
  $("#rAgain").onclick = () => startRun(shuffle(list));
  $("#rHome").onclick = () => { run = null; show("home"); };
}

function show(v){
  ["home","quiz","result"].forEach(id => $("#"+id).classList.toggle("hidden", id !== v));
  $("#dock").classList.toggle("hidden", v !== "home");
  if (v !== "quiz") $("#qdock").classList.add("hidden");
  if (v === "home") renderHome();
  window.scrollTo({top:0});
}

renderHome();
})();
</script>
